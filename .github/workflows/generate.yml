name: generate-video
run-name: "studio ${{ inputs.job_id }}"
# Free, public-repo GitHub-hosted runner as an on-demand worker. Triggered by Vercel (workflow_dispatch API),
# by Claude Code (`gh`/MCP), or by hand from the Actions tab. The finished MP4 is published as a Release asset.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
      topic:
        description: "Documentary topic (needs an LLM key secret OR script_json)"
        required: false
        default: ""
      script_json:
        description: "Pre-written script JSON (see examples/sloth.json)"
        required: false
        default: ""
      orientation:
        description: "vertical | landscape"
        required: false
        default: "vertical"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      STUDIO_MODELS: ${{ github.workspace }}/.models
      STUDIO_DATA: ${{ github.workspace }}/.data
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-v1-${{ hashFiles('scripts/download_models.sh') }}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r engine/requirements.txt
          scripts/download_models.sh
      - name: Generate
        timeout-minutes: 300
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_JSON: ${{ inputs.script_json }}
        run: |
          cd engine
          args=(--job "${{ inputs.job_id }}" --orientation "${{ inputs.orientation }}")
          if [ -n "$SCRIPT_JSON" ]; then printf '%s' "$SCRIPT_JSON" > /tmp/script.json; args+=(--script /tmp/script.json); fi
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          python -u -m studio generate "${args[@]}"
      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=".data/jobs/${{ inputs.job_id }}"
          if [ -f "$d/output.mp4" ]; then
            gh release create "video-${{ inputs.job_id }}" "$d/output.mp4" "$d/report.json" "$d/script.json" \
              --title "Video ${{ inputs.job_id }}" --notes "Generated by My AI Video Studio (run ${{ github.run_id }})"
          fi
