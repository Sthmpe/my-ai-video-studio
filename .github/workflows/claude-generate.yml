name: claude-generate-video
run-name: "claude-studio ${{ inputs.job_id }}"
concurrency:
  group: claude-gen-${{ inputs.job_id }}
  cancel-in-progress: false
# Free, public-repo GitHub-hosted runner as an on-demand worker. Triggered by Vercel (workflow_dispatch API),
# by Claude Code (`gh`/MCP), or by hand from the Actions tab. The finished MP4 is published as a Release asset.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
      topic:
        description: "Documentary topic (needs an LLM key secret OR script_json)"
        required: false
        default: ""
      script_json:
        description: "Pre-written script JSON (see examples/sloth.json)"
        required: false
        default: ""
      mode:
        description: "documentary | anime_action | superhuman | anime_edit | cinematic | story | explainer"
        required: false
        default: "documentary"
      aspect:
        description: "9:16 | 16:9 | 1:1"
        required: false
        default: "9:16"
      seconds:
        description: "Target duration in seconds (15, 30, 60, 90, 180 or custom)"
        required: false
        default: "45"
      language:
        description: "en | ja"
        required: false
        default: "en"
      continue_from:
        description: "Job id of a previous claude-video release to continue as the next episode"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      STUDIO_MODELS: ${{ github.workspace }}/.models
      STUDIO_DATA: ${{ github.workspace }}/.data
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-ipafont-gothic
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-v1-${{ hashFiles('scripts/download_models.sh') }}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r engine/requirements.txt
          scripts/download_models.sh
      - name: Generate
        timeout-minutes: 320
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_JSON: ${{ inputs.script_json }}
          MODE: ${{ inputs.mode }}
          ASPECT: ${{ inputs.aspect }}
          SECONDS_IN: ${{ inputs.seconds }}
          LANG_IN: ${{ inputs.language }}
          CONT: ${{ inputs.continue_from }}
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job_id }}
        run: |
          cd engine
          [ -n "$SCRIPT_JSON" ] && printf '%s' "$SCRIPT_JSON" > /tmp/script.json
          if [ -n "$CONT" ]; then
            mkdir -p /tmp/prev && gh release download "claude-video-$CONT" -p '*.studio.zip' -D /tmp/prev -R "$GITHUB_REPOSITORY"
            args=(continue --bundle "$(ls /tmp/prev/*.studio.zip | head -1)" --job "$JOB")
            if [ -f /tmp/script.json ]; then args+=(--script /tmp/script.json); else args+=(--idea "$TOPIC"); fi
          elif [ "$MODE" = "documentary" ] && ! grep -q '"lines"' /tmp/script.json 2>/dev/null; then
            ori=vertical; [ "$ASPECT" = "16:9" ] && ori=landscape
            args=(generate --job "$JOB" --orientation "$ori" --seconds "$SECONDS_IN")
            [ -f /tmp/script.json ] && args+=(--script /tmp/script.json)
            [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          else
            args=(story --job "$JOB" --mode "$MODE" --aspect "$ASPECT" --seconds "$SECONDS_IN" --language "$LANG_IN")
            if [ -f /tmp/script.json ]; then args+=(--script /tmp/script.json); else args+=(--idea "$TOPIC"); fi
          fi
          python -u -m studio "${args[@]}"
          if [ "$MODE" = "documentary" ] && [ -z "$CONT" ]; then python -m studio export --job "$JOB" || true; fi
      - name: Upload bundle as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-studio-${{ inputs.job_id }}
          path: .data/jobs/${{ inputs.job_id }}/*.studio.zip
          if-no-files-found: ignore
      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=".data/jobs/${{ inputs.job_id }}"
          if [ -f "$d/output.mp4" ]; then
            files=("$d/output.mp4" "$d/report.json" "$d/script.json"); for f in "$d"/*.studio.zip "$d"/GENERATION_REPORT.md "$d"/generation_report.json "$d"/social.json "$d"/output_ja.mp4; do [ -f "$f" ] && files+=("$f"); done
            gh release create "claude-video-${{ inputs.job_id }}" "${files[@]}" \
              --title "Video ${{ inputs.job_id }}" --notes "Generated by My AI Video Studio (run ${{ github.run_id }})"
          fi
